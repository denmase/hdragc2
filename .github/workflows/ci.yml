name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:

env:
  ZIG_VERSION: "0.16.0"

jobs:
  build:
    name: Build plugin (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            target: x86_64-linux
            ext: tar.xz
          - name: windows-x64
            os: windows-latest
            target: x86_64-windows
            ext: zip
          - name: macos-arm64
            os: macos-latest
            target: aarch64-macos
            ext: tar.xz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Toolchain is downloaded straight from ziglang.org (release naming is
      # target-first since 0.15.x: zig-<target>-<version>.<ext>) and cached —
      # this avoids third-party installer actions and their mirror roulette.
      - name: Cache Zig toolchain
        id: cache-zig
        uses: actions/cache@v4
        with:
          path: zig-tool
          key: zig-${{ env.ZIG_VERSION }}-${{ matrix.target }}

      - name: Install Zig (tarball)
        if: ${{ matrix.ext == 'tar.xz' && steps.cache-zig.outputs.cache-hit != 'true' }}
        run: |
          curl -fsSL -o /tmp/zig.tar.xz             "https://ziglang.org/download/${{ env.ZIG_VERSION }}/zig-${{ matrix.target }}-${{ env.ZIG_VERSION }}.tar.xz"
          mkdir -p zig-tool
          tar xf /tmp/zig.tar.xz -C zig-tool --strip-components=1

      - name: Install Zig (zip)
        if: ${{ matrix.ext == 'zip' && steps.cache-zig.outputs.cache-hit != 'true' }}
        shell: pwsh
        run: |
          curl -fsSL -o "$env:TEMP\zig.zip"             "https://ziglang.org/download/${{ env.ZIG_VERSION }}/zig-${{ matrix.target }}-${{ env.ZIG_VERSION }}.zip"
          Expand-Archive "$env:TEMP\zig.zip" -DestinationPath zig-raw
          Move-Item "zig-raw\zig-${{ matrix.target }}-${{ env.ZIG_VERSION }}" zig-tool

      - name: Add Zig to PATH
        shell: bash
        run: echo "${{ github.workspace }}/zig-tool" >> "$GITHUB_PATH"

      - name: Build
        run: zig build -Doptimize=ReleaseFast -Dcpu=baseline

      - name: Verify generic-CPU baseline (no AVX in artifact)
        if: runner.os != 'macOS'
        shell: bash   # default shell on Windows runners is pwsh - this step is bash
        run: |
          # NOTE: GitHub wraps run: in "bash -e -o pipefail" — never use
          # bare A && B && C chains here (a false test kills the whole
          # step); use if/then, which is exempt from -e.
          LIB=$(ls zig-out/bin/* zig-out/lib/* 2>/dev/null | head -1 || true)
          OD=$(command -v objdump || command -v llvm-objdump || true)
          if [ -z "$OD" ]; then
            if [ -x "/c/Program Files/LLVM/bin/llvm-objdump.exe" ]; then
              OD="/c/Program Files/LLVM/bin/llvm-objdump.exe"
            fi
          fi
          if [ -z "$OD" ]; then
            echo "WARN: no objdump available on this runner, baseline check skipped"
          elif "$OD" -d "$LIB" 2>/dev/null > "$RUNNER_TEMP/dis.txt"; grep -qE "zmm|ymm|vzeroupper|vbroadcast" "$RUNNER_TEMP/dis.txt"; then
            echo "ERROR: $LIB contains AVX instructions (not generic x86-64 baseline)"; exit 1
          else
            echo "baseline OK: $LIB ($OD)"
          fi

      - name: Upload artifact (Windows)
        if: matrix.ext == 'zip'
        uses: actions/upload-artifact@v4
        with:
          name: hdragc2-${{ matrix.name }}
          path: zig-out/bin/hdragc2.dll

      - name: Upload artifact (Unix)
        if: matrix.ext == 'tar.xz'
        uses: actions/upload-artifact@v4
        with:
          name: hdragc2-${{ matrix.name }}
          path: |
            zig-out/lib/*.so
            zig-out/lib/*.dylib

  test-linux:
    name: Numerical cross-check (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Zig toolchain
        id: cache-zig
        uses: actions/cache@v4
        with:
          path: zig-tool
          key: zig-${{ env.ZIG_VERSION }}-x86_64-linux

      - name: Install Zig
        if: steps.cache-zig.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o /tmp/zig.tar.xz             "https://ziglang.org/download/${{ env.ZIG_VERSION }}/zig-x86_64-linux-${{ env.ZIG_VERSION }}.tar.xz"
          mkdir -p zig-tool
          tar xf /tmp/zig.tar.xz -C zig-tool --strip-components=1

      - name: Add Zig to PATH
        run: echo "${{ github.workspace }}/zig-tool" >> "$GITHUB_PATH"

      - name: Build plugin
        run: zig build -Doptimize=ReleaseFast -Dcpu=baseline

      # AviSynth+ publishes no official Linux binaries — build AvsCore from
      # source. IMPORTANT: build from the vendored, pinned source tree
      # (vendor/avisynthplus) so the library exactly matches the headers the
      # plugin was compiled against; a version mismatch crashes avs_invoke.
      - name: Cache AviSynth+ build
        id: cache-avs
        uses: actions/cache@v4
        with:
          path: /tmp/avsbuild/avs_core
          key: avsplus-vendored-avs-core

      - name: Build AviSynth+ from vendored source
        if: steps.cache-avs.outputs.cache-hit != 'true'
        run: |
          cmake -S vendor/avisynthplus -B /tmp/avsbuild -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/avsbuild --target AvsCore -j$(nproc)

      - name: Build host test
        run: |
          cp zig-out/lib/libhdragc2.so /tmp/libhdragc2.so
          gcc -O2 -I vendor/avisynthplus/avs_core/include test/host.c \
              -o /tmp/host -L/tmp/avsbuild/avs_core -lavisynth \
              -Wl,-rpath,/tmp/avsbuild/avs_core

      - name: Run host test
        run: LD_LIBRARY_PATH=/tmp/avsbuild/avs_core /tmp/host

      - name: Cross-check against Python reference
        run: |
          pip install numpy
          python3 test/reference.py
          python3 test/reference_aurora.py

  # Publishes a GitHub Release when a v* tag is pushed (e.g. from GitHub
  # Desktop: History -> right-click commit -> Create Tag, then Push origin).
  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, test-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Package
        run: |
          cd dist
          for d in hdragc2-*; do
            (cd "$d" && zip -9 "../$d.zip" *)
          done
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
